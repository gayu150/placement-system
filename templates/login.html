<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Recruitment & Placement Management System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-icon">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h2 style="font-size: 1.4rem; font-weight: 700; color: #0f172a;">Recruit & Place Portal</h2>
      <p style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">Sign in to access student placement & recruitment services</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'danger' if category == 'error' else category }}" style="margin-bottom: 16px;">
            <i class="fa-solid fa-circle-exclamation"></i>
            <div>{{ message }}</div>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <div style="position: relative;">
          <input type="text" id="username" name="username" class="form-control" placeholder="Enter username (e.g. admin)" required autofocus>
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In
      </button>
    </form>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
